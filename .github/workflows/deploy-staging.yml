name: deploy-staging
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: deploy-staging, cancel-in-progress: false }

permissions:
  contents: read
  id-token: write   # Workload Identity Federation

env:
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.AR_REPO }}/pehle-aap

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push
        run: |
          docker build --build-arg GIT_SHA=${GITHUB_SHA} -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GCP_REGION }}
      - uses: azure/setup-helm@v4
      - name: helm upgrade (staging)
        run: |
          helm upgrade --install pehle-aap deploy/helm/pehle-aap \
            --namespace staging \
            -f deploy/helm/pehle-aap/values-staging.yaml \
            --set image.repository="${IMAGE}" --set image.tag="${GITHUB_SHA}" \
            --wait --timeout 5m --atomic
      - name: Health check
        run: curl -fsS "${{ vars.STAGING_URL }}/api/health" | tee /dev/stderr | grep -q "\"sha\":\"${GITHUB_SHA}\""
