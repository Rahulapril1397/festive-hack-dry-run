replicaCount: 2
appEnv: production
appUrl: https://pehleaap.example
ingress:
  host: pehleaap.example
  staticIpName: pehle-aap-prod-ip
serviceAccount:
  gcpServiceAccount: pehle-aap-prod@PROJECT.iam.gserviceaccount.com
externalSecrets:
  projectId: PROJECT
  prefix: prod-
# Small enough that 2 replicas fit on existing Autopilot nodes (new projects have 250 GB regional
# SSD quota = 2 nodes' boot disks). Raise once the quota is increased.
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: 500m, memory: 512Mi }
