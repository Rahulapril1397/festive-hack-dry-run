{{- if .Values.ingress.enabled }}
{{- $tls := and .Values.ingress.host .Values.ingress.managedCertificate }}
{{- if $tls }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "pehle.name" . }}-cert
spec:
  domains: [{{ .Values.ingress.host | quote }}]
---
{{- end }}
# No host → plain HTTP on the static IP (no certificate possible without a domain).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pehle.name" . }}
  labels: {{- include "pehle.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: gce
    {{- with .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ . }}
    {{- end }}
    {{- if $tls }}
    networking.gke.io/managed-certificates: {{ include "pehle.name" . }}-cert
    {{- end }}
spec:
  defaultBackend:
    service: { name: {{ include "pehle.name" . }}, port: { name: http } }
  {{- with .Values.ingress.host }}
  rules:
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "pehle.name" $ }}, port: { name: http } }
  {{- end }}
{{- end }}
