{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.managedCertificate }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "pehle.name" . }}-cert
spec:
  domains: [{{ .Values.ingress.host | quote }}]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pehle.name" . }}
  labels: {{- include "pehle.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: gce
    {{- with .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ . }}
    {{- end }}
    {{- if .Values.ingress.managedCertificate }}
    networking.gke.io/managed-certificates: {{ include "pehle.name" . }}-cert
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "pehle.name" . }}, port: { name: http } }
{{- end }}
