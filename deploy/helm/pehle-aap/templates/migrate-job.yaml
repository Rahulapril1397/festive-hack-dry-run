{{- if .Values.migrations.enabled }}
{{- if .Values.externalSecrets.enabled }}
# DATABASE_URL for the migration Job only. Created as a hook so it exists before the Job runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pehle-aap-migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: gcp-secret-manager }
  target: { name: pehle-aap-migrate, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: {{ .Values.externalSecrets.prefix }}{{ .Values.externalSecrets.migrateKey }} }
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pehle.name" . }}-migrate
  labels: {{- include "pehle.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "pehle.name" . }}-migrate }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - secretRef: { name: {{ if .Values.externalSecrets.enabled }}pehle-aap-migrate{{ else }}pehle-aap-secrets{{ end }} }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
{{- end }}
