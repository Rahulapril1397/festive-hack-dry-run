{{- if .Values.externalSecrets.enabled }}
# Requires the External Secrets Operator (deploy/README.md). Reads Secret Manager with the
# pod's Workload Identity, writes the k8s Secret "pehle-aap-secrets".
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  labels: {{- include "pehle.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "externalSecrets.projectId" .Values.externalSecrets.projectId }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pehle-aap-secrets
  labels: {{- include "pehle.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: SecretStore, name: gcp-secret-manager }
  target: { name: pehle-aap-secrets, creationPolicy: Owner }
  data:
  {{- range $env, $secret := .Values.externalSecrets.keys }}
    - secretKey: {{ $env }}
      remoteRef: { key: {{ $secret }} }
  {{- end }}
{{- end }}
