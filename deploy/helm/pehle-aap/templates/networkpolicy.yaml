# /api/metrics is also bearer-protected; this keeps the pod reachable only from the load
# balancer / ingress path and from Prometheus in the "monitoring" namespace (E2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pehle.name" . }}
spec:
  podSelector:
    matchLabels: {{- include "pehle.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 130.211.0.0/22 }   # Google LB health checks + proxies
        - ipBlock: { cidr: 35.191.0.0/16 }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: {{ .Values.service.targetPort }} }]
