apiVersion: v1
kind: Service
metadata:
  name: {{ include "pehle.name" . }}
  labels: {{- include "pehle.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ include "pehle.name" . }}"}'
spec:
  type: ClusterIP
  selector: {{- include "pehle.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "pehle.name" . }}
spec:
  timeoutSec: {{ .Values.backendConfig.timeoutSec }}
  healthCheck: { type: HTTP, requestPath: /api/health, port: {{ .Values.service.targetPort }} }
