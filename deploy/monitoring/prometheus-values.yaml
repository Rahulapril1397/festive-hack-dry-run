# E2: Prometheus in the cluster ("monitoring" namespace), scraping /api/metrics over the
# internal Service with the bearer token. The app's NetworkPolicy admits the monitoring namespace.
#   kubectl create ns monitoring
#   kubectl -n monitoring create secret generic pehle-metrics-token --from-literal=token=$METRICS_TOKEN
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus prometheus-community/prometheus -n monitoring -f deploy/monitoring/prometheus-values.yaml
alertmanager: { enabled: false }
prometheus-pushgateway: { enabled: false }
kube-state-metrics: { enabled: false }
prometheus-node-exporter: { enabled: false }
server:
  persistentVolume: { size: 8Gi }
  extraSecretMounts:
    - name: pehle-metrics-token
      secretName: pehle-metrics-token
      mountPath: /etc/pehle
      readOnly: true
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: pehle-aap-staging
        metrics_path: /api/metrics
        authorization: { type: Bearer, credentials_file: /etc/pehle/token }
        static_configs: [{ targets: ["pehle-aap.staging.svc.cluster.local:80"], labels: { env: staging } }]
      - job_name: pehle-aap-prod
        metrics_path: /api/metrics
        authorization: { type: Bearer, credentials_file: /etc/pehle/token }
        static_configs: [{ targets: ["pehle-aap.prod.svc.cluster.local:80"], labels: { env: prod } }]
  alerting_rules.yml:
    groups:
      - name: pehle-tts
        rules:
          - alert: TtsFailing
            expr: sum(increase(pehle_tts_requests_total{result=~"failure|timeout"}[5m])) >= 3
            labels: { severity: warning }
            annotations: { summary: "Sarvam TTS failing; NudgeBee scenario: recommend voice_calls OFF" }
